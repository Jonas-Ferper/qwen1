<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário Religioso Católico - Brasil | Santoral CNBB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <div class="logo-section">
                    <span class="cross-symbol">✝</span>
                    <h1>Calendário Religioso Católico</h1>
                </div>
                <p class="subtitle">Santoral Oficial da Igreja Católica no Brasil</p>
                <p class="source">Baseado no Calendário Nacional da CNBB</p>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="liturgical-info-section">
                    <h3>Informações Litúrgicas</h3>
                    <div id="liturgical-info-content" class="liturgical-info-content">
                        <!-- Conteúdo preenchido dinamicamente -->
                    </div>
                </div>

                <div class="legend-section">
                    <h3>Legenda</h3>
                    <div class="legend-item">
                        <span class="legend-color solemnity-color"></span>
                        <span>Solenidade</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color feast-color"></span>
                        <span>Festa</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color obligatory-color"></span>
                        <span>Memória Obrigatória</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color optional-color"></span>
                        <span>Memória Facultativa</span>
                    </div>
                </div>

                <div class="mobile-dates-info">
                    <h3>Datas Móveis</h3>
                    <div id="mobile-dates-list"></div>
                </div>
            </aside>

            <main class="calendar-section">
                <div class="calendar-header">
                    <button id="prev-year" class="nav-btn" title="Ano anterior">«</button>
                    <button id="prev-month" class="nav-btn" title="Mês anterior">‹</button>
                    
                    <div class="current-date-display">
                        <select id="month-select"></select>
                        <select id="year-select"></select>
                    </div>
                    
                    <button id="next-month" class="nav-btn" title="Próximo mês">›</button>
                    <button id="next-year" class="nav-btn" title="Próximo ano">»</button>
                </div>

                <div class="calendar-grid">
                    <div class="weekday">Dom</div>
                    <div class="weekday">Seg</div>
                    <div class="weekday">Ter</div>
                    <div class="weekday">Qua</div>
                    <div class="weekday">Qui</div>
                    <div class="weekday">Sex</div>
                    <div class="weekday">Sáb</div>
                </div>

                <div id="calendar-days" class="calendar-days"></div>
            </main>

            <aside class="details-panel" id="details-panel">
                <div class="panel-header">
                    <button id="close-panel" class="close-btn">×</button>
                    <h2 id="panel-date"></h2>
                    <p id="panel-weekday"></p>
                </div>
                
                <div id="panel-content" class="panel-content">
                    <!-- Conteúdo preenchido dinamicamente -->
                </div>
            </aside>
        </div>
    </div>

    <script src="santoral.js"></script>
    <script src="mobile-dates.js"></script>
    <script src="app.js"></script>
</body>
</html>
